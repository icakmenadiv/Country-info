<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>국별환경 갱신 우선순위 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <p class="eyebrow">OCIS COUNTRY INFO · EUROPE & CENTRAL ASIA</p>
        <h1>국별환경 갱신 우선순위 대시보드</h1>
        <p class="sub">OCIS 최근 수정일만으로 오래된 국가와 항목을 추천합니다.</p>
      </div>
      <div class="hero-actions">
        <button id="copyRun">갱신 후보 5개 추천</button>
      </div>
    </header>

    <section id="summary" class="summary-grid"></section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>다음 추천 국가</h2>
          <p>국가별 가장 오래된 OCIS 수정일을 비교합니다.</p>
        </div>
      </div>
      <div id="nextTarget" class="next-target"></div>
    </section>

    <section class="panel">
      <div class="panel-head controls">
        <div>
          <h2>국가별 최신성 현황</h2>
          <p>국가를 선택하면 수정일이 오래된 항목부터 확인할 수 있습니다.</p>
        </div>
        <div class="filter-row">
          <select id="regionFilter">
            <option value="ALL">전체 지역</option>
            <option value="Europe">유럽</option>
            <option value="Central Asia">중앙아시아</option>
          </select>
          <input id="countrySearch" type="search" placeholder="국가 검색" />
        </div>
      </div>
      <div id="countryGrid" class="country-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 id="detailTitle">국가 상세</h2>
          <p id="detailSub">국가를 선택하세요.</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th><th>항목</th><th>OCIS 수정일</th><th>원문</th>
            </tr>
          </thead>
          <tbody id="itemTable"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <span>추천 기준: OCIS 수정일만 사용 · 본문/기존값 저장 없음</span>
      <a href="https://ocis.go.kr/" target="_blank" rel="noreferrer">OCIS 열기 ↗</a>
    </footer>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
